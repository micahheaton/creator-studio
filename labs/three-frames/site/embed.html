<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Signal desk movement study</title><style>html,body{margin:0;background:#11292e;color:#fff0cf}video,img{max-width:100%;height:auto;display:block;margin:auto}[hidden]{display:none}</style><img id="still" src="animation/poster.png" width="640" height="800" alt="A pad sends a pulse to a scope below it."><video id="loop" hidden width="640" height="800" muted loop playsinline controls preload="none" poster="animation/poster.png" aria-label="Four-second silent loop of the pad focal point and signal trace"><source src="animation/loop.webm" type="video/webm"><source src="animation/loop.mp4" type="video/mp4"></video><script>const motion=matchMedia('(prefers-reduced-motion: reduce)'),v=document.getElementById('loop'),poster=document.getElementById('still');function update(){if(motion.matches){v.pause();v.hidden=true;poster.hidden=false;}else{v.hidden=false;poster.hidden=true;v.play().catch(()=>{});}}motion.addEventListener('change',update);update();</script></html>
